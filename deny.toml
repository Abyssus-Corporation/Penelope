# cargo-deny configuration for Penelope.
# Every exception below must carry a reason, an owner and a review date.
#
# sqlx uses `tls-rustls-ring-native-roots` so this tree does not depend on
# webpki-roots (CDLA-Permissive-2.0). Revisit this if the TLS feature changes.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Format: { id = "RUSTSEC-YYYY-NNNN", reason = "why it is not exploitable here; owner; review by YYYY-MM-DD" }
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses compatible with Penelope's Apache-2.0 license.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
